# Pipeline Logstash: nhan syslog tu pfSense (UDP 5140), tach filterlog va canh bao Suricata
input {
  udp {
    port => 5140
    type => "pfsense"
  }
}

filter {
  # 1. Tach phan dau syslog: <PRI>Oct 27 09:09:05 program[pid]: noi dung
  grok {
    match => { "message" => "^<%{NONNEGINT:syslog_priority}>%{SYSLOGTIMESTAMP:syslog_ts} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_msg}$" }
    tag_on_failure => ["_syslog_grok_failure"]
  }

  # 2. Lay gio trong log lam gio su kien (pfSense dung gio Viet Nam)
  if "_syslog_grok_failure" not in [tags] {
    date {
      match => ["syslog_ts", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      timezone => "Asia/Ho_Chi_Minh"
      target => "@timestamp"
    }
  }

  # 3. Log firewall (filterlog) dang CSV
  if [program] == "filterlog" {
    csv {
      source => "log_msg"
      columns => ["rule_number","sub_rule","anchor","tracker","interface","reason","action","direction","ip_version","tos","ecn","ttl","ip_id","offset","ip_flags","proto_id","protocol","length","src_ip","dst_ip","src_port","dst_port","data_length","tcp_flags","tcp_seq","tcp_ack","tcp_window","tcp_urg","tcp_options"]
      skip_empty_columns => true
    }
    mutate { add_field => { "log_type" => "firewall" } }

    if [ip_version] != "4" {
      # IPv6 co bo cuc khac, bo cac cot co the sai
      mutate {
        add_tag => ["filterlog_not_ipv4"]
        remove_field => ["tos","ecn","ttl","ip_id","offset","ip_flags","proto_id","protocol","length","src_ip","dst_ip","src_port","dst_port","data_length","tcp_flags","tcp_seq","tcp_ack","tcp_window","tcp_urg","tcp_options"]
      }
    } else if [protocol] not in ["tcp","udp"] {
      # ICMP va giao thuc khac khong co cong
      mutate {
        remove_field => ["src_port","dst_port","data_length","tcp_flags","tcp_seq","tcp_ack","tcp_window","tcp_urg","tcp_options"]
      }
    }
    mutate {
      convert => { "src_port" => "integer" "dst_port" => "integer" "rule_number" => "integer" "ttl" => "integer" "length" => "integer" "data_length" => "integer" }
    }
  }

  # 4. Canh bao Suricata: [gid:sid:rev] mo ta [Classification: ...] [Priority: n] {PROTO} ip:port -> ip:port
  else if [program] == "suricata" {
    mutate { add_field => { "log_type" => "ids" } }
    grok {
      match => { "log_msg" => "^(?:\[\*\*\] )?\[%{INT:gid}:%{INT:sid}:%{INT:rev}\] %{DATA:alert_msg}(?: \[\*\*\])? \[Classification: %{DATA:classification}\] \[Priority: %{INT:priority}\] \{%{WORD:protocol}\} %{IP:src_ip}(?::%{INT:src_port})? -> %{IP:dst_ip}(?::%{INT:dst_port})?" }
      tag_on_failure => ["_suricata_grok_failure"]
    }
    mutate {
      lowercase => ["protocol"]
      convert => { "priority" => "integer" "src_port" => "integer" "dst_port" => "integer" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pfsense-parsed-%{+YYYY.MM.dd}"
  }
  # Chi in ra console cac dong khong phan tich duoc, de debug
  if "_suricata_grok_failure" in [tags] or "_syslog_grok_failure" in [tags] {
    stdout { codec => rubydebug }
  }
}
